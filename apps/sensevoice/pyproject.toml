[project]
name = "sensevoice-local"
version = "0.1.0"
description = "Local SenseVoice runtime backed by the vendored FunASR source tree"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.111.1",
  "funasr>=1.3.26",
  "gradio",
  "huggingface",
  "huggingface-hub",
  "modelscope",
  "numpy<=1.26.4",
  "torch>=2.12.1",
  "torchaudio>=2.11.0",
  "torchcodec",
]

[tool.uv]
package = false

[tool.uv.sources]
funasr = { path = "../funasr", editable = true }
